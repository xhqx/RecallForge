[package]
name = "recallforge"
version = "0.1.0"
edition = "2024"
description = "Local project memory with evidence, hybrid retrieval, and MCP"
license = "MIT"
repository = "https://github.com/xhqx/RecallForge"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
fastembed = { version = "=6.0.3", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"] }
hf-hub = { version = "=0.5.0", default-features = false, features = ["ureq", "native-tls"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlite-vec = "=0.1.9"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
